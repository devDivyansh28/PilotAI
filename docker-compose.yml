services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: PilotAI-postgres-build    
    environment:
      POSTGRES_DB: pilotai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - pilotai_pg_data:/var/lib/postgresql/data
     
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pilotai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pilotai_pg_data: